<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .bg { fill: #0d1117; }
      .text-glow { fill: #00D4AA; filter: drop-shadow(0 0 8px rgba(0,212,170,0.6)); font-family: 'JetBrains Mono', monospace; font-weight: 700; text-anchor: middle; }
      .text-sub { fill: #8892B0; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-anchor: middle; letter-spacing: 2px; }
      .trace { stroke: #1f6b59; stroke-width: 2; fill: none; stroke-linecap: round; }
      .pulse { fill: #00D4AA; filter: drop-shadow(0 0 5px #00D4AA); }
      .mcu { fill: #161b22; stroke: #00D4AA; stroke-width: 2; rx: 8; }
      .pin { fill: #30363d; }
      .log { fill: #c9d1d9; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      .log-success { fill: #00D4AA; }
      .fade-in { animation: fadeIn 4s infinite; }
      @keyframes pulseAnim1 { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 40% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
      @keyframes pulseAnim2 { 0% { offset-distance: 0%; opacity: 0; } 20% { opacity: 1; } 50% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
      @keyframes bootLog { 0%, 30% { opacity: 0; } 35%, 100% { opacity: 1; } }
      @keyframes bootLog2 { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
      @keyframes bootLog3 { 0%, 50% { opacity: 0; } 55%, 100% { opacity: 1; } }
      @keyframes bootLog4 { 0%, 60% { opacity: 0; } 65%, 100% { opacity: 1; } }
      @keyframes bootLog5 { 0%, 70% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes mcuGlow { 0%, 25% { stroke: #1f6b59; filter: none; } 30%, 100% { stroke: #00D4AA; filter: drop-shadow(0 0 10px rgba(0,212,170,0.8)); } }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400" />
  
  <!-- Identity -->
  <text x="400" y="60" class="text-glow" font-size="32">PRIYADHARSAN D</text>
  <text x="400" y="90" class="text-sub">EMBEDDED SYSTEMS ENGINEER</text>
  <text x="400" y="115" class="text-sub" font-size="12">MCU • FIRMWARE • RTOS • EDGE AI</text>

  <!-- PCB Traces -->
  <g transform="translate(0, 50)">
    <path id="trace1" class="trace" d="M 100 200 L 250 200 L 300 250 L 350 250" />
    <path id="trace2" class="trace" d="M 700 150 L 600 150 L 550 200 L 450 200" />
    <path id="trace3" class="trace" d="M 200 300 L 250 300 L 300 250" />
    <path id="trace4" class="trace" d="M 600 300 L 550 300 L 500 250 L 450 250" />
    
    <!-- Animated Signal Pulses -->
    <circle class="pulse" r="4" style="offset-path: path('M 100 200 L 250 200 L 300 250 L 350 250'); animation: pulseAnim1 4s linear infinite;" />
    <circle class="pulse" r="4" style="offset-path: path('M 700 150 L 600 150 L 550 200 L 450 200'); animation: pulseAnim2 4s linear infinite;" />
    <circle class="pulse" r="4" style="offset-path: path('M 200 300 L 250 300 L 300 250'); animation: pulseAnim1 4s linear infinite; animation-delay: 1s;" />
    <circle class="pulse" r="4" style="offset-path: path('M 600 300 L 550 300 L 500 250 L 450 250'); animation: pulseAnim2 4s linear infinite; animation-delay: 1.5s;" />
  </g>

  <!-- Central MCU -->
  <g transform="translate(350, 200)">
    <!-- Pins top/bottom -->
    <rect x="10" y="-8" width="6" height="10" class="pin" />
    <rect x="30" y="-8" width="6" height="10" class="pin" />
    <rect x="50" y="-8" width="6" height="10" class="pin" />
    <rect x="70" y="-8" width="6" height="10" class="pin" />
    <rect x="90" y="-8" width="6" height="10" class="pin" />
    <rect x="10" y="98" width="6" height="10" class="pin" />
    <rect x="30" y="98" width="6" height="10" class="pin" />
    <rect x="50" y="98" width="6" height="10" class="pin" />
    <rect x="70" y="98" width="6" height="10" class="pin" />
    <rect x="90" y="98" width="6" height="10" class="pin" />
    <!-- Pins left/right -->
    <rect x="-8" y="10" width="10" height="6" class="pin" />
    <rect x="-8" y="30" width="10" height="6" class="pin" />
    <rect x="-8" y="50" width="10" height="6" class="pin" />
    <rect x="-8" y="70" width="10" height="6" class="pin" />
    <rect x="98" y="10" width="10" height="6" class="pin" />
    <rect x="98" y="30" width="10" height="6" class="pin" />
    <rect x="98" y="50" width="10" height="6" class="pin" />
    <rect x="98" y="70" width="10" height="6" class="pin" />
    
    <!-- Body -->
    <rect x="0" y="0" width="100" height="100" class="mcu" style="animation: mcuGlow 4s infinite;" />
    <circle cx="20" cy="20" r="4" fill="#30363d" />
    
    <!-- Inner Chip Label -->
    <text x="50" y="55" class="text-sub" style="font-size: 16px; font-weight: bold; fill: #c9d1d9;">ARM</text>
  </g>

  <!-- Boot Log Sequence -->
  <g transform="translate(150, 340)">
    <text x="0" y="0" class="log" style="animation: bootLog 4s infinite;">[ <tspan class="log-success">OK</tspan> ] POWER ........... DETECTED</text>
    <text x="0" y="15" class="log" style="animation: bootLog2 4s infinite;">[ <tspan class="log-success">OK</tspan> ] MCU ............. INITIALIZED</text>
    <text x="0" y="30" class="log" style="animation: bootLog3 4s infinite;">[ <tspan class="log-success">OK</tspan> ] PERIPHERALS ..... ONLINE</text>
    <text x="250" y="0" class="log" style="animation: bootLog4 4s infinite;">[ <tspan class="log-success">OK</tspan> ] RTOS ............ μT-KERNEL 3.0</text>
    <text x="250" y="15" class="log" style="animation: bootLog5 4s infinite;">[ <tspan class="log-success">OK</tspan> ] EDGE AI ......... READY</text>
    <text x="250" y="35" class="log-success" style="font-family: 'JetBrains Mono', monospace; font-weight: bold; animation: bootLog5 4s infinite; font-size: 14px;">SYSTEM ONLINE █</text>
  </g>

</svg>
