<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .bg { fill: #0d1117; }
      .term-bg { fill: #000000; stroke: #30363d; stroke-width: 2; rx: 6; }
      .term-header { fill: #161b22; }
      .circle-r { fill: #ff5f56; } .circle-y { fill: #ffbd2e; } .circle-g { fill: #27c93f; }
      .text-code { fill: #c9d1d9; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
      .text-cmd { fill: #00D4AA; }
      .text-ok { fill: #4ade80; }
      .blink { animation: blinkCursor 1s infinite; }
      
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes line1 { 0%, 10% { opacity: 0; } 10.1%, 100% { opacity: 1; } }
      @keyframes line2 { 0%, 25% { opacity: 0; } 25.1%, 100% { opacity: 1; } }
      @keyframes line3 { 0%, 40% { opacity: 0; } 40.1%, 100% { opacity: 1; } }
      @keyframes line4 { 0%, 55% { opacity: 0; } 55.1%, 100% { opacity: 1; } }
      @keyframes line5 { 0%, 70% { opacity: 0; } 70.1%, 100% { opacity: 1; } }
      @keyframes line6 { 0%, 85% { opacity: 0; } 85.1%, 100% { opacity: 1; } }
    </style>
  </defs>

  <rect class="bg" width="800" height="250" />
  
  <g transform="translate(100, 20)">
    <rect class="term-bg" width="600" height="210" />
    <path class="term-header" d="M 0 6 Q 0 0 6 0 L 594 0 Q 600 0 600 6 L 600 25 L 0 25 Z" />
    <circle cx="15" cy="12" r="5" class="circle-r" />
    <circle cx="30" cy="12" r="5" class="circle-y" />
    <circle cx="45" cy="12" r="5" class="circle-g" />
    
    <text x="20" y="55" class="text-code">$ <tspan class="text-cmd">./embedded_boot</tspan></text>
    <text x="20" y="85" class="text-code" style="animation: line1 5s infinite;">MCU ............... <tspan class="text-ok">READY</tspan></text>
    <text x="20" y="105" class="text-code" style="animation: line2 5s infinite;">PERIPHERALS ....... <tspan class="text-ok">READY</tspan></text>
    <text x="20" y="125" class="text-code" style="animation: line3 5s infinite;">COMMUNICATION ..... <tspan class="text-ok">READY</tspan></text>
    <text x="20" y="145" class="text-code" style="animation: line4 5s infinite;">RTOS .............. <tspan class="text-ok">READY</tspan></text>
    <text x="20" y="165" class="text-code" style="animation: line5 5s infinite;">EDGE AI ........... <tspan class="text-ok">READY</tspan></text>
    
    <text x="20" y="195" class="text-code text-cmd" style="animation: line6 5s infinite;">SYSTEM STATUS: ONLINE <tspan class="text-code blink">█</tspan></text>
  </g>
</svg>
