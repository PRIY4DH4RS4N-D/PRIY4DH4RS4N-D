<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .bg { fill: #0d1117; }
      .board { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 6; }
      .board-glow { stroke: #00D4AA; filter: drop-shadow(0 0 6px rgba(0,212,170,0.5)); }
      .board-text { fill: #c9d1d9; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .wire { stroke: #1f6b59; stroke-width: 2; fill: none; stroke-linecap: round; }
      .sys-box { fill: #0d1117; stroke: #8892B0; stroke-width: 2; stroke-dasharray: 4; rx: 8; }
      .led { fill: #30363d; }
      
      @keyframes blink { 0%, 100% { fill: #30363d; filter: none; } 50% { fill: #00D4AA; filter: drop-shadow(0 0 5px #00D4AA); } }
      @keyframes blink-red { 0%, 100% { fill: #30363d; filter: none; } 50% { fill: #FF6F00; filter: drop-shadow(0 0 5px #FF6F00); } }
      @keyframes blink-blue { 0%, 100% { fill: #30363d; filter: none; } 50% { fill: #005CED; filter: drop-shadow(0 0 5px #005CED); } }
    </style>
  </defs>

  <rect class="bg" width="800" height="300" />

  <!-- Wires -->
  <path class="wire" d="M 150 110 L 150 160 L 400 160 L 400 200" />
  <path class="wire" d="M 400 110 L 400 200" />
  <path class="wire" d="M 650 110 L 650 160 L 400 160" />
  
  <path class="wire" d="M 275 110 L 275 135 L 400 135 L 400 160" />
  <path class="wire" d="M 525 110 L 525 135 L 400 135" />

  <!-- Top Row Boards -->
  <!-- STM32 -->
  <g transform="translate(90, 40)">
    <rect width="120" height="70" class="board board-glow" />
    <circle cx="10" cy="10" r="3" class="led" style="animation: blink 2s infinite;" />
    <text x="60" y="35" class="board-text">STM32</text>
  </g>

  <!-- RENESAS -->
  <g transform="translate(225, 40)">
    <rect width="100" height="70" class="board" />
    <circle cx="10" cy="10" r="3" class="led" style="animation: blink-blue 3s infinite; animation-delay: 0.5s;" />
    <text x="50" y="35" class="board-text">RENESAS</text>
  </g>

  <!-- ESP32 -->
  <g transform="translate(340, 40)">
    <rect width="120" height="70" class="board" />
    <circle cx="10" cy="10" r="3" class="led" style="animation: blink-red 2.5s infinite; animation-delay: 1s;" />
    <text x="60" y="35" class="board-text">ESP32</text>
  </g>

  <!-- UNO Q -->
  <g transform="translate(475, 40)">
    <rect width="100" height="70" class="board" />
    <circle cx="10" cy="10" r="3" class="led" style="animation: blink 2s infinite; animation-delay: 1.5s;" />
    <text x="50" y="35" class="board-text">UNO Q</text>
  </g>

  <!-- FPGA / SoC -->
  <g transform="translate(590, 40)">
    <rect width="120" height="70" class="board" stroke="#FF6F00" />
    <circle cx="10" cy="10" r="3" class="led" style="animation: blink-red 1.8s infinite;" />
    <text x="60" y="35" class="board-text" style="fill:#FF6F00;">FPGA/SoC</text>
  </g>

  <!-- Central System -->
  <g transform="translate(300, 200)">
    <rect width="200" height="80" class="sys-box" />
    <text x="100" y="35" class="board-text" style="fill: #8892B0;">PHYSICAL</text>
    <text x="100" y="55" class="board-text" style="fill: #8892B0;">SYSTEM</text>
  </g>

</svg>
