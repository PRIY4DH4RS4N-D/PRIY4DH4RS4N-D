<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; rx: 8; }
      .title { fill: #f0f6fc; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; }
      .badge-bg { fill: #facc15; rx: 12; }
      .badge-text { fill: #000000; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .arch-box { fill: #161b22; stroke: #00D4AA; stroke-width: 1.5; rx: 4; }
      .arch-text { fill: #c9d1d9; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: #8892B0; }
      .flow { fill: #00D4AA; filter: drop-shadow(0 0 4px #00D4AA); }
      @keyframes pulseFlow { 0% { opacity: 0; transform: translateX(-5px); } 50% { opacity: 1; transform: translateX(5px); } 100% { opacity: 0; transform: translateX(15px); } }
    </style>
  </defs>

  <rect class="bg" width="796" height="296" x="2" y="2" />
  
  <text x="40" y="50" class="title">WAFERWISE</text>
  
  <!-- Badges -->
  <g transform="translate(40, 70)">
    <rect width="130" height="24" class="badge-bg"/><text x="65" y="12" class="badge-text">NXP i.MX RT1170</text>
  </g>
  <g transform="translate(180, 70)">
    <rect width="70" height="24" class="badge-bg"/><text x="35" y="12" class="badge-text">91.25%</text>
  </g>
  <g transform="translate(260, 70)">
    <rect width="100" height="24" class="badge-bg"/><text x="50" y="12" class="badge-text">11 CLASSES</text>
  </g>
  
  <g transform="translate(40, 105)">
    <rect width="160" height="24" class="badge-bg"/><text x="80" y="12" class="badge-text">65% MODEL REDUCTION</text>
  </g>
  <g transform="translate(210, 105)">
    <rect width="110" height="24" class="badge-bg"/><text x="55" y="12" class="badge-text">TFLITE MICRO</text>
  </g>

  <!-- Key Info -->
  <text x="40" y="165" font-family="'Inter', sans-serif" font-size="14" fill="#8892B0" font-weight="700">SEMICONDUCTOR INSPECTION</text>
  <text x="40" y="185" font-family="'Inter', sans-serif" font-size="14" fill="#c9d1d9">Deep learning defect classification on</text>
  <text x="40" y="205" font-family="'Inter', sans-serif" font-size="14" fill="#c9d1d9">resource-constrained crossover MCU.</text>

  <!-- Architecture Flow -->
  <g transform="translate(480, 120)">
    <!-- Horizontal pipeline -->
    <rect x="0" y="0" width="80" height="30" class="arch-box"/><text x="40" y="15" class="arch-text">IMAGING</text>
    
    <path class="arrow" d="M 85 10 L 95 15 L 85 20 Z" />
    <circle cx="85" cy="15" r="3" class="flow" style="animation: pulseFlow 2s infinite;" />

    <rect x="100" y="0" width="80" height="30" class="arch-box" stroke="#FF6F00"/><text x="140" y="15" class="arch-text" style="fill:#FF6F00">TFLITE</text>
    
    <path class="arrow" d="M 185 10 L 195 15 L 185 20 Z" />
    <circle cx="185" cy="15" r="3" class="flow" style="animation: pulseFlow 2s infinite; animation-delay: 0.5s;" />

    <rect x="200" y="-15" width="80" height="60" class="arch-box" stroke="#c084fc"/><text x="240" y="15" class="arch-text" style="fill:#c084fc">DEFECT</text>
  </g>
</svg>
